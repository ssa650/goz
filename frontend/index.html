<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GOZ · Video player</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script>
</head>
<body><main>
  <header><a class="brand" href="/">GOZ<span class="dot"></span></a><a href="/adaptive.html">Open adaptive story →</a><span id="backend-status" class="badge">Connecting…</span></header>
  <section id="sensor-setup" aria-label="Sensor setup" hidden>
    <strong id="sensor-title">Connecting sensors</strong>
    <p id="sensor-message" role="status" aria-live="polite"></p>
    <p id="sensor-progress"></p>
    <p id="gaze-calibration-status"></p>
    <button id="gaze-calibration-remove" class="secondary" type="button" hidden>Remove eye calibration</button>
    <button id="sensor-retry" class="secondary" type="button" hidden>Retry sensor setup</button>
  </section>
  <section class="player-panel" aria-label="Video player">
    <div class="player-heading"><h1>Your next scene.</h1><button id="fullscreen" type="button" class="secondary">Fullscreen</button></div>
    <div id="screen">
      <video id="video-a" tabindex="-1" playsinline preload="auto" disablepictureinpicture disableremoteplayback hidden></video>
      <video id="video-b" tabindex="-1" playsinline preload="auto" disablepictureinpicture disableremoteplayback hidden></video>
      <div id="overlay"><span id="overlay-message">Your sequence is ready. Click Generate.</span></div>
    </div>
    <p id="playback-status" role="status">12 clips · playback starts as soon as clip 1 is ready.</p>
    <div class="generation-actions">
      <button id="generate" type="button" disabled>Generate</button>
      <button id="download" type="button" class="secondary" disabled>Download</button>
      <button id="regenerate" type="button" class="secondary" disabled>Regenerate</button>
    </div>
    <p id="generation-status" role="status" aria-live="polite">Loading sequence…</p>
    <p id="generation-error" role="alert" hidden></p>
  </section>
  <details id="generation-times">
    <summary>Generation times <span id="timing-summary"></span></summary>
    <div class="timing-scroll"><table><thead><tr><th>Clip</th><th>Status</th><th>Total</th><th>Generation</th></tr></thead><tbody id="timing-rows"></tbody></table></div>
  </details>
</main></body></html>
